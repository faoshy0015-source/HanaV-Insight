name: HanaV Morning Brief
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview only (no Telegram message)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hanav-morning-brief
  cancel-in-progress: false
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and Korean font
        run: |
          python -m pip install 'yfinance>=0.2.55,<2' 'pandas-market-calendars>=5,<6' 'Pillow>=10,<13' 'requests>=2.31,<3'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Generate and send
        env:
          RADAR_TELEGRAM_BOT_TOKEN: ${{ secrets.RADAR_TELEGRAM_BOT_TOKEN }}
          RADAR_TELEGRAM_CHAT_ID: ${{ secrets.RADAR_TELEGRAM_CHAT_ID }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python morning_brief.py --preview
          else
            python morning_brief.py
          fi
      - name: Save preview image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief
          path: morning_brief.png
          if-no-files-found: ignore
          retention-days: 7
