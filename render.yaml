services:
  - type: worker
    name: hanav-futures-radar
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install 'requests>=2.31,<3'
    startCommand: python -u futures_radar_engine.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: KIS_APP_KEY
        sync: false
      - key: KIS_APP_SECRET
        sync: false
      - key: FUTURES_CONTRACTS
        sync: false
      - key: RADAR_TELEGRAM_BOT_TOKEN
        sync: false
      - key: RADAR_TELEGRAM_CHAT_ID
        sync: false
      - key: RADAR_ALERT_NEWS
        value: "true"
